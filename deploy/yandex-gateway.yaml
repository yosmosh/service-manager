openapi: 3.0.0
info:
  title: sad-budushego-site
  version: 1.0.0
  description: >
    sad-budushego.ru as served in Russia. The page and its libraries come from Object Storage
    (bucket sad-budushego-site, published by deploy/yandex-site.ps1); /api/* — the AI invoice
    reader, the Telegram drafts — is passed on to the Vercel functions, which stay outside
    Russia because the Anthropic API doesn't accept requests from there.

x-yc-apigateway:
  variables:
    backendHost:
      default: "api.sad-budushego.ru"
      description: >
        The Vercel project's own domain for /api/* — what the request says it is for (Host), so
        Vercel knows the project. Not *.vercel.app: those addresses do not connect from Russia
        (Yandex's own servers included), and are behind Vercel's login besides. Not www either:
        that is this gateway now.
    backendAddress:
      default: "9e8f911dea7b4d7b.vercel-dns-017.com"
      description: >
        Where the connection for /api/* goes — the name Vercel gave for the project's domains
        (api.sad-budushego.ru is a CNAME to it). Connecting to it directly keeps /api working
        whatever Yandex's own resolvers think of our zone, which were slow to pick it up after
        it moved to Yandex DNS.

paths:
  /:
    get:
      x-yc-apigateway-integration:
        type: object_storage
        bucket: sad-budushego-site
        object: service-manager.html
        service_account_id: ajep053p13thhsapa7r6

  # The page under another name, for the open tabs' check for a new deploy (_pageEtag):
  # HEAD answers with the page's Last-Modified, which every upload moves forward.
  /app-version:
    get:
      x-yc-apigateway-integration:
        type: object_storage
        bucket: sad-budushego-site
        object: service-manager.html
        service_account_id: ajep053p13thhsapa7r6
    head:
      x-yc-apigateway-integration:
        type: object_storage
        bucket: sad-budushego-site
        object: service-manager.html
        service_account_id: ajep053p13thhsapa7r6

  /api/{path+}:
    x-yc-apigateway-any-method:
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      # Every header and query parameter goes on as it came (by default the gateway passes
      # neither — Content-Type, the Telegram secret and ?force=1 were all lost), except Host:
      # that must be the backend's own, or the TLS connection to it fails.
      x-yc-apigateway-integration:
        type: http
        url: https://${var.backendAddress}/api/{path}
        headers:
          '*': '*'
          Host: ${var.backendHost}
        query:
          '*': '*'
        timeouts:
          connect: 10
          read: 120

  # The app's data — the Cloud Function «data-api» (yandex/data-api): Firestore-shaped REST
  # over YDB and the files bucket. Called through the gateway so it is on our own address.
  /db/{rest+}:
    x-yc-apigateway-any-method:
      parameters:
        - name: rest
          in: path
          required: true
          schema:
            type: string
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: d4e7okpot0k25pk5b8em
        service_account_id: ajep053p13thhsapa7r6

  /{file+}:
    get:
      parameters:
        - name: file
          in: path
          required: true
          schema:
            type: string
      x-yc-apigateway-integration:
        type: object_storage
        bucket: sad-budushego-site
        object: '{file}'
        service_account_id: ajep053p13thhsapa7r6
    # An open tab asks HEAD /service-manager.html every few minutes to notice a new deploy
    # (_pageEtag); without this the gateway answered 405 and tabs never picked one up.
    head:
      parameters:
        - name: file
          in: path
          required: true
          schema:
            type: string
      x-yc-apigateway-integration:
        type: object_storage
        bucket: sad-budushego-site
        object: '{file}'
        service_account_id: ajep053p13thhsapa7r6
